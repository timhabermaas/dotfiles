theme = "catppuccin_macchiato"

[editor]
line-number = "relative"
trim-trailing-whitespace = true
trim-final-newlines = true
soft-wrap.enable = true

[editor.file-picker]
hidden = false

[editor.whitespace.render]
space = "all"

[keys.insert]
j = { k = "normal_mode" }

[keys.normal]
C-g = ":echo %sh{~/.config/helix/scripts/git-copy-permalink.sh %{buffer_name} %{selection_line_start} %{selection_line_end}}"
g = { q = ":reflow" }

# Switch <space>+f and <space>+F. By default <space>+f opens a file picker for
# the workspace root, not current directory.
[keys.normal.space]
f = "file_picker_in_current_directory"
F = "file_picker"
